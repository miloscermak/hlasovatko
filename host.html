<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlasovátko – lektor</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="host">

<div class="center" id="screen-start" data-screen>
  <h1>Hlasovátko</h1>
  <p>Založ novou session pro dnešní workshop.</p>
  <p><button id="btn-create">Založit session</button></p>
  <p><button class="ghost" id="btn-resume" hidden></button></p>
</div>

<div id="screen-stage" data-screen hidden>
  <header class="topbar">
    <div class="qr-mini" id="qr-mini"></div>
    <div>
      <div class="label">Kód</div>
      <div class="code" id="out-code"></div>
    </div>
    <div>
      <div class="label">Připoj se na</div>
      <div class="url" id="out-url"></div>
    </div>
    <div class="spacer"></div>
    <div>
      <div class="label">Připojeno</div>
      <div class="count" id="out-count">0</div>
    </div>
  </header>

  <main class="board" id="board"></main>

  <div class="strip" id="strip" hidden>
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="ghost small" id="btn-names">Skrýt jména</button>
      <button class="ghost small" id="btn-export-one">Stáhnout otázku</button>
      <button class="ghost small" id="btn-export-all">Stáhnout vše</button>
    </div>
  </div>

  <footer class="composer">
    <div class="fields">
      <div class="types" id="in-types"></div>
      <input type="text" id="in-question" placeholder="Otázka, např. Je tu teplo, nebo zima?" autocomplete="off">
      <div class="options" id="in-options"></div>
    </div>
    <div class="actions">
      <button id="btn-start">Spustit hlasování</button>
      <button class="ghost" id="btn-draft">Uložit koncept</button>
      <button class="ghost" id="btn-close" disabled>Ukončit hlasování</button>
    </div>
  </footer>
</div>

<script src="js/vendor/firebase-app-compat.js"></script>
<script src="js/vendor/firebase-auth-compat.js"></script>
<script src="js/vendor/firebase-database-compat.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/common.js?v=2"></script>
<script src="js/host.js?v=2"></script>
</body>
</html>
